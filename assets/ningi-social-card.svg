<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ningi Detection Lab social card</title>
  <desc id="desc">Open Graph social card for ningi.dev matching the Ningi Detection Lab visual style.</desc>
  <defs>
    <linearGradient id="ring" x1="816" y1="130" x2="1074" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F4D8C"/>
      <stop offset="1" stop-color="#16386B"/>
    </linearGradient>
    <linearGradient id="mark" x1="850" y1="176" x2="1026" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F4D8C"/>
      <stop offset="1" stop-color="#16386B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="10" height="630" fill="#1F4D8C"/>

  <text x="82" y="244" fill="#171A21" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800">Ningi Detection Lab</text>
  <text x="86" y="313" fill="#1F4D8C" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">LIVE SECURITY RESEARCH LAB</text>
  <text x="86" y="382" fill="#565F6D" font-family="Segoe UI, Arial, sans-serif" font-size="31">detections, honeypots, incident response</text>
  <text x="86" y="441" fill="#565F6D" font-family="Segoe UI, Arial, sans-serif" font-size="25">detections, tooling, and lessons from the lab</text>
  <text x="86" y="493" fill="#838C99" font-family="Segoe UI, Arial, sans-serif" font-size="23">www.ningi.dev | troy@ningi.dev</text>

  <g>
    <circle cx="956" cy="318" r="150" fill="#F6F7F9"/>
    <circle cx="956" cy="318" r="141" stroke="url(#ring)" stroke-width="9"/>
    <path d="M864 405V231H905L1007 354V231H1050V405H1009L906 280V405H864Z" fill="url(#mark)"/>
    <circle cx="1072" cy="224" r="11" fill="#1F4D8C"/>
  </g>
</svg>
