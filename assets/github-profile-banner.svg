<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ningi Detection Lab GitHub profile banner</title>
  <desc id="desc">Light detection-lab banner for ningi.dev GitHub profile and repository README headers.</desc>
  <defs>
    <linearGradient id="ring" x1="870" y1="132" x2="1136" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F4D8C"/>
      <stop offset="1" stop-color="#16386B"/>
    </linearGradient>
    <linearGradient id="mark" x1="904" y1="180" x2="1082" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F4D8C"/>
      <stop offset="1" stop-color="#16386B"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#FFFFFF"/>
  <rect width="10" height="640" fill="#1F4D8C"/>

  <g>
    <text x="86" y="252" fill="#171A21" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="800">Ningi Detection Lab</text>
    <text x="90" y="320" fill="#1F4D8C" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">LIVE SECURITY RESEARCH LAB</text>
    <text x="90" y="388" fill="#565F6D" font-family="Segoe UI, Arial, sans-serif" font-size="31">detections, honeypots, incident response</text>
    <text x="90" y="447" fill="#565F6D" font-family="Segoe UI, Arial, sans-serif" font-size="25">Wazuh SIEM | Cowrie honeypots | Linux | Docker | IPv6</text>
    <text x="90" y="500" fill="#838C99" font-family="Segoe UI, Arial, sans-serif" font-size="23">www.ningi.dev | troy@ningi.dev</text>
  </g>

  <g>
    <circle cx="1010" cy="320" r="150" fill="#F6F7F9"/>
    <circle cx="1010" cy="320" r="141" stroke="url(#ring)" stroke-width="9"/>
    <path d="M918 407V233H959L1061 356V233H1104V407H1063L960 282V407H918Z" fill="url(#mark)"/>
    <circle cx="1126" cy="226" r="11" fill="#1F4D8C"/>
  </g>
</svg>
